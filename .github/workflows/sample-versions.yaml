name: Sample Tagging
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Set Tag
        id: set_tag
        run: |
          echo "tag=$(echo $GITHUB_REF | sed -n 's/refs\/tags\/v//p')" >> $GITHUB_OUTPUT
  tag:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Tag lowercase
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo ${TAG,,}
  